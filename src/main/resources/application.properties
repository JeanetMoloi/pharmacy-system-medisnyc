# Application
spring.application.name=pharmacy-system
server.port=8090

# MySQL Datasource
# Make sure MySQL Workbench / MySQL Server is running locally on port 3306.
# createDatabaseIfNotExist=true will create the schema automatically on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/pharmacy_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Naledi@01
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
# NOTE for demo/capstone purposes only - in a real system this secret would come
# from an environment variable, not be committed to source control.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Password reset mail delivery (configure SMTP_HOST, SMTP_PORT, SMTP_USERNAME,
# SMTP_PASSWORD and SMTP_FROM in the deployment environment).
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
app.mail.from=${SMTP_FROM:no-reply@medisnyc.local}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Set false for production deployments.
app.seed.admin=true
app.seed.admin-username=${ADMIN_USERNAME:admin}
app.seed.admin-email=${ADMIN_EMAIL:admin@medisync.example}
app.seed.admin-password=${ADMIN_PASSWORD:Admin@12345}
app.seed.sample-doctors=true
app.seed.doctor-logins=true
app.seed.doctor-password=password
